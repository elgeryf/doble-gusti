<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Beat 'em Up - Gusty vs Hinchas</title>
    <style>
        body {
            background-color: #040406;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
            overflow: hidden;
        }
        h1 {
            margin: 0 0 2px 0;
            font-size: 1rem;
            letter-spacing: 2px;
            color: #ff5722;
            text-transform: uppercase;
        }
        .game-container {
            position: relative;
            box-shadow: 0 15px 40px rgba(0,0,0,0.9);
            border: 3px solid #222;
            border-radius: 10px;
            overflow: hidden;
            max-width: 100vw;
            max-height: 85vh;
            aspect-ratio: 800 / 450;
            background: #000;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        .menu-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(20,20,35,0.98) 0%, rgba(5,5,10,1) 100%);
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 15px;
            box-sizing: border-box;
        }
        .menu-screen h2 {
            color: #ff5722;
            font-size: 2rem;
            margin: 0 0 5px 0;
            text-shadow: 0 3px 8px rgba(255,87,34,0.5);
            letter-spacing: 2px;
        }
        .menu-screen p {
            color: #aaa;
            font-size: 0.9rem;
            margin-bottom: 15px;
            line-height: 1.4;
            max-width: 350px;
        }
        .high-scores-table {
            width: 100%;
            max-width: 300px;
            margin-bottom: 10px;
            border-collapse: collapse;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            overflow: hidden;
        }
        .high-scores-table th, .high-scores-table td {
            text-align: left;
            padding: 5px 8px;
            font-size: 0.75rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        .high-scores-table th { color: #ffb74d; background: rgba(0,0,0,0.2); }
        .high-scores-table td.rank { color: #ff5722; font-weight: bold; width: 25px; }
        .high-scores-table td.score { color: #fff; text-align: right; font-family: monospace; }
        #playerNameInput {
            background: rgba(0,0,0,0.5);
            border: 1px solid #555;
            color: #fff;
            padding: 6px;
            border-radius: 5px;
            font-size: 1rem;
            text-align: center;
            margin-bottom: 8px;
            width: 90px;
            text-transform: uppercase;
        }
        .menu-btn {
            background: linear-gradient(135deg, #ff5722 0%, #e64a19 100%);
            color: white;
            border: 2px solid #ffb74d;
            padding: 8px 20px;
            font-size: 0.9rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(255, 87, 34, 0.4);
            margin: 5px;
            font-family: inherit;
        }
        .kill-counter-hud {
            position: absolute;
            top: 10px;
            right: 15px;
            background: rgba(10, 10, 18, 0.85);
            border: 1px solid #ff5722;
            border-radius: 6px;
            padding: 4px 8px;
            text-align: right;
            font-size: 11px;
            color: #fff;
            pointer-events: none;
            display: none;
            z-index: 20;
            line-height: 1.2;
        }
        .kill-counter-hud .total { color: #ffb74d; font-weight: bold; }
    </style>
</head>
<body>

    <h1>Gusty vs Hinchas</h1>
    <div class="game-container" id="gameContainer">
        
        <div class="kill-counter-hud" id="killCounterHud">
            <span class="total" id="hudTotalKills">TOTAL: 0</span><br/>
            <span id="hudType1">Comunes: 0</span><br/>
            <span id="hudBoss">Jefes: 0</span>
        </div>

        <!-- Pantalla de Inicio -->
        <div id="start-screen" class="menu-screen">
            <h2>GUSTY VS HINCHAS</h2>
            <p>Usa las flechas o W, A, S, D para moverte. Presiona ESPACIO para golpear.</p>
            <button class="menu-btn" id="start-game-btn">¡COMENZAR!</button>
            <h3 style="color: #ffb74d; margin: 10px 0 3px 0; font-size: 0.8rem;">MEJORES PUNTUACIONES</h3>
            <table class="high-scores-table" id="startHighScoresList"></table>
        </div>

        <!-- Pantalla de Game Over -->
        <div id="gameover-screen" class="menu-screen" style="display: none;">
            <h2>¡GAME OVER!</h2>
            <p style="margin-bottom: 5px;">Puntuación: <strong id="finalScoreText" style="color:#ffb74d;">0</strong></p>
            <p style="font-size: 0.8rem; color: #aaa;" id="goKillsSummary">Hinchas eliminados: 0</p>
            
            <div id="highscore-form" style="display: none;">
                <p style="margin-bottom: 5px; font-size: 0.85rem;">¡Nuevo Récord! Ingresa tus iniciales (3 letras):</p>
                <input type="text" id="playerNameInput" maxlength="3" placeholder="AAA" />
                <br/>
                <button class="menu-btn" id="saveScoreBtn">GUARDAR</button>
            </div>

            <div id="final-scores-list" style="display: none; width: 100%; flex-direction: column; align-items: center;">
                <h3 style="color: #ffb74d; margin: 5px 0; font-size: 0.8rem;">RANKING TOP 5</h3>
                <table class="high-scores-table" id="gameOverHighScoresList"></table>
                <button class="menu-btn" id="restart-game-btn">VOLVER A JUGAR</button>
            </div>
        </div>

        <canvas id="gameCanvas" width="800" height="450"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        function getHighScores() {
            let scores = localStorage.getItem('gusty_highscores_v2');
            return scores ? JSON.parse(scores) : [];
        }

        function saveHighScores(scores) {
            localStorage.setItem('gusty_highscores_v2', JSON.stringify(scores));
        }

        function renderHighScoresTable(tableId) {
            const table = document.getElementById(tableId);
            if (!table) return;
            const scores = getHighScores();
            let html = '<tr><th>#</th><th>Nombre</th><th style="text-align:right">Pts</th></tr>';
            if (scores.length === 0) {
                html += '<tr><td colspan="3" style="text-align:center; color:#777;">Sin récords</td></tr>';
            } else {
                scores.forEach((s, index) => {
                    html += `<tr><td class="rank">${index + 1}</td><td>${s.name}</td><td class="score">${s.score}</td></tr>`;
                });
            }
            table.innerHTML = html;
        }

        renderHighScoresTable('startHighScoresList');

        let gameRunning = false;
        let wave = 1;
        let score = 0;
        let kills = { total: 0, type1: 0, boss: 0 };

        let player = { x: 100, y: 300, width: 40, height: 70, speed: 4, attackCooldown: 0 };
        let enemies = [];
        let keys = {};

        window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
        window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

        function startGame() {
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('gameover-screen').style.display = 'none';
            document.getElementById('killCounterHud').style.display = 'block';
            
            gameRunning = true;
            wave = 1;
            score = 0;
            kills = { total: 0, type1: 0, boss: 0 };
            player.x = 100;
            player.y = 300;
            spawnWave();
            loop();
        }

        function spawnWave() {
            enemies = [];
            let count = 2 + wave;
            for(let i = 0; i < count; i++) {
                enemies.push({
                    x: 700 + Math.random() * 80,
                    y: 240 + Math.random() * 120,
                    width: 40, height: 70, 
                    hp: 20 + wave * 5, 
                    type: (wave % 3 === 0 && i === 0) ? 'boss' : 'type1'
                });
            }
        }

        function gameOver() {
            gameRunning = false;
            document.getElementById('killCounterHud').style.display = 'none';
            document.getElementById('gameover-screen').style.display = 'flex';
            
            score = wave * 100;
            document.getElementById('finalScoreText').innerText = score;
            document.getElementById('goKillsSummary').innerText = `Hinchas eliminados: ${kills.total} (Comunes: ${kills.type1}, Jefes: ${kills.boss})`;

            const highScores = getHighScores();
            const lowestScore = highScores.length < 5 ? 0 : highScores[highScores.length - 1].score;

            if (highScores.length < 5 || score > lowestScore) {
                document.getElementById('highscore-form').style.display = 'block';
                document.getElementById('final-scores-list').style.display = 'none';
            } else {
                document.getElementById('highscore-form').style.display = 'none';
                document.getElementById('final-scores-list').style.display = 'flex';
                renderHighScoresTable('gameOverHighScoresList');
            }
        }

        document.getElementById('start-game-btn').addEventListener('click', startGame);
        document.getElementById('restart-game-btn').addEventListener('click', startGame);

        document.getElementById('saveScoreBtn').addEventListener('click', () => {
            let nameInput = document.getElementById('playerNameInput').value.trim().toUpperCase() || 'AAA';
            nameInput = nameInput.substring(0, 3);
            
            let highScores = getHighScores();
            highScores.push({ name: nameInput, score: score });
            highScores.sort((a, b) => b.score - a.score);
            if (highScores.length > 5) highScores = highScores.slice(0, 5);
            
            saveHighScores(highScores);
            
            document.getElementById('highscore-form').style.display = 'none';
            document.getElementById('final-scores-list').style.display = 'flex';
            renderHighScoresTable('gameOverHighScoresList');
            renderHighScoresTable('startHighScoresList');
        });

        function update() {
            if (!gameRunning) return;

            if (keys['arrowup'] || keys['w']) player.y -= player.speed;
            if (keys['arrowdown']|| keys['s']) player.y += player.speed;
            if (keys['arrowleft']|| keys['a']) player.x -= player.speed;
            if (keys['arrowright']||keys['d']) player.x += player.speed;

            if (player.y < 230) player.y = 230;
            if (player.y > 370) player.y = 370;
            if (player.x < 20) player.x = 20;
            if (player.x > 760) player.x = 760;

            if (keys[' '] && player.attackCooldown === 0) {
                player.attackCooldown = 15;
                enemies.forEach((en, idx) => {
                    if (Math.abs(en.x - player.x) < 60 && Math.abs(en.y - player.y) < 30) {
                        en.hp -= 25;
                        if (en.hp <= 0) {
                            kills.total++;
                            if (en.type === 'boss') kills.boss++;
                            else kills.type1++;
                            enemies.splice(idx, 1);
                        }
                    }
                });
            }
            if (player.attackCooldown > 0) player.attackCooldown--;

            if (enemies.length === 0) {
                wave++;
                spawnWave();
            }

            // Presiona X para probar el Game Over de inmediato si lo deseas
            if (keys['x']) {
                gameOver();
            }

            // Actualizar HUD en vivo
            document.getElementById('hudTotalKills').innerText = `TOTAL: ${kills.total}`;
            document.getElementById('hudType1').innerText = `Comunes: ${kills.type1}`;
            document.getElementById('hudBoss').innerText = `Jefes: ${kills.boss}`;
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Suelo
            ctx.fillStyle = '#111';
            ctx.fillRect(0, 220, canvas.width, 230);

            // Jugador
            ctx.fillStyle = '#2196f3';
            ctx.fillRect(player.x, player.y - player.height, player.width, player.height);

            // Enemigos
            enemies.forEach(en => {
                ctx.fillStyle = en.type === 'boss' ? '#e91e63' : '#f44336';
                ctx.fillRect(en.x, en.y - en.height, en.width, en.height);
            });
        }

        function loop() {
            if (!gameRunning) return;
            update();
            draw();
            requestAnimationFrame(loop);
        }
    </script>
</body>
</html>
